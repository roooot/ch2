name: Build and deploy to Liara

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: liara-production
  cancel-in-progress: true

env:
  APP_ID: liara-copilot
  LIARA_TEAM_ID: 6a86b5ef55e397b04bf25728
  IMAGE_NAME: ghcr.io/roooot/ch2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Deploy the published image to Liara
        env:
          LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          npm install --global @liara/cli@9 --no-audit --no-fund
          liara deploy \
            --app "$APP_ID" \
            --team-id "$LIARA_TEAM_ID" \
            --api-token "$LIARA_API_TOKEN" \
            --image "$IMAGE_TAG" \
            --port 3000 \
            --no-app-logs
